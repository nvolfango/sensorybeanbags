name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is committed pre-built, so nothing is compiled here. This just
      # proves the committed HTML still matches src/pages/ and legacy/.
      - name: Check the built HTML is up to date
        run: |
          python3 tools/build.py
          if [ -n "$(git status --porcelain -- '*.html')" ]; then
            echo "::error::Built HTML is out of date. Run 'python3 tools/build.py' and commit the result."
            git status --short -- '*.html'
            exit 1
          fi

      # Assemble only what should be served into dist/ (see tools/dist.py).
      - name: Collect the deployable files
        run: python3 tools/dist.py github

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
