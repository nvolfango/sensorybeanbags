name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is committed pre-built, so there is nothing to compile here.
      # This step just proves the committed HTML matches src/pages/.
      - name: Verify the built HTML is up to date
        run: |
          python3 tools/build.py
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Built HTML is out of date. Run 'python3 tools/build.py' and commit the result."
            git diff --stat -- '*.html'
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
