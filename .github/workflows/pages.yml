name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is committed pre-built, so nothing is compiled here. This just
      # proves the committed HTML still matches src/pages/.
      - name: Check the built HTML is up to date
        run: |
          python3 tools/build.py
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Built HTML is out of date. Run 'python3 tools/build.py' and commit the result."
            git diff --stat -- '*.html'
            exit 1
          fi

      # Assemble only what should be served. src/, tools/ and .git stay behind.
      # legacy/ is the archived copy of the old WordPress site (tools/mirror_legacy.py).
      - name: Collect the deployable files
        run: |
          mkdir _site
          cp *.html robots.txt .nojekyll _site/
          cp -r assets _site/
          if [ -d legacy ]; then cp -r legacy _site/; fi
          find _site -type f -not -path '_site/legacy/*' | sort
          echo "legacy/: $(find _site/legacy -type f 2>/dev/null | wc -l) files"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
